<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="base/global.css"> 
   
    <title>Tarefas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 1018px;
            height: 368.5px;
            box-sizing: border-box;
        }
        .flex-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }
        .titulo-container {
            width: 457px;
            height: 68px;
            gap: 4px;
        }
        .prioridade-container {
            width: 216.5px;
            height: 68px;
            gap: 4px;
        }
        .data-container {
            width: 216.5px;
            height: 68px;
            gap: 4px;
        }
        
        label, input, textarea, select {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }
        input, textarea, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .clear-btn {
            background: #dbd8d8;
            width: 169px;
            height: 33px;
            border-radius: 1px 8px;
        }
        .add-btn {
            background: #333;
            color: white;
            width: 169px;
            height: 33px;
            border-radius: 1px 8px;
        }
        .discricao {
            width: 457px;
            height: 107.5px;
            gap: 4px;
        }
        .legend {
            width: 938px;
            height: 107.5px;
            margin-bottom: 10px;
        }
        .checkbox-group {
            display: flex;
            justify-content: space-between;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

<main>
    <div class="container">
        <div class="flex-container">
            <div class="titulo-container">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Ex.: Revisar código crítico">
            </div>
            <div class="prioridade-container">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade">
                    <option>Alta</option>
                    <option>Média</option>
                    <option>Baixa</option>
                </select>
            </div>
            <div class="data-container">
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>
        </div>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder="Revisar bugs críticos no módulo principal."></textarea>

        <div class="form-group">
            <legend>Responsável(is):</legend>
            <div class="checkbox-group">
                <label><input type="checkbox"> Alice</label>
                <label><input type="checkbox"> Carlos</label>
                <label><input type="checkbox"> Fabiano</label>
                <label><input type="checkbox"> Fernanda</label>
                <label><input type="checkbox"> Luísa</label>
                <label><input type="checkbox"> Marcos</label>
            </div>
        </div>
            
        <div class="buttons">
            <button class="clear-btn">Limpar</button>
            <button class="add-btn">Adicionar</button>
        </div>
    </div>
